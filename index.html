<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section>
    <div class="box">
      <h2>Password Generator</h2>
      <div class="input-box">
        <input type="text" id="task" placeholder="Generator Password..." readonly>
        <button id="copy">copy</button>
      </div>
      <div class="passLength">
        <label>Password Length</label>
        <span id="passLength-value">12</span>
      </div>
      <input type="range" id="range" min="8" max="20" value="12"/>
      
    <div class="checkbox">
      <input type="checkbox" id="checkbox1" / checked>
      <label for="checkbox1" class="box1">Uppercase</label>
      </div>
      <div>
      <input type="checkbox" id="checkbox2" / checked>
      <label for="checkbox2" class="box2">Lowercase</label>
      </div>
      <div>
      <input type="checkbox" id="checkbox3" / checked>
      <label for="checkbox3" class="box3">Numbers</label>
      </div>
      <div>
      <input type="checkbox" id="checkbox4" / checked>
      <label for="checkbox4" class="box4">Symbols</label>
    </div>
    <div class="btn-box">
    <button id="Generator">Generator</button>
    </div>
    </div>
  </section>
  <script src="script.js"></script>
</body>

</html>
